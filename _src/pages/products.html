<section class="page-hero">
  <div class="wrap">
    <h1>Products</h1>
    <p class="lead">Core products across our four divisions. Add what you need to your quote and send one request for everything.</p>
  </div>
</section>

<section class="section" style="padding-top:56px">
  <div class="wrap">
    <div class="catalogue-bar">
      <div class="filters" role="group" aria-label="Filter by division">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">All products</button>
        <button type="button" class="filter" data-filter="food" aria-pressed="false">Food &amp; bakery</button>
        <button type="button" class="filter" data-filter="build" aria-pressed="false">Construction</button>
        <button type="button" class="filter" data-filter="chem" aria-pressed="false">Industrial inputs</button>
        <button type="button" class="filter" data-filter="auto" aria-pressed="false">Automotive &amp; fleet</button>
      </div>
      <label class="search">{{icon:search}}<span class="hp">Search products</span><input id="product-search" type="search" placeholder="Search products or HS codes" autocomplete="off"></label>
    </div>
    <p class="form-note" data-result-count aria-live="polite" style="margin:-16px 0 20px"></p>
    <div class="products-grid" id="catalogue"></div>
    <div class="panel panel-fog" style="margin-top:48px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px" data-reveal>
      <div><h3>Need something that isn't listed?</h3><p style="margin:8px 0 0;color:var(--muted)">We source to your specification across all four divisions. Describe the product and we'll find the right manufacturer.</p></div>
      <a class="btn btn-navy" href="/quote">Describe what you need</a>
    </div>
  </div>
